<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Figtree, Arial, sans-serif; fill: #2c3e50; }
      .th  { font-size: 14px; font-weight: 500; }
      .ts  { font-size: 12px; font-weight: 400; }
      .owner-box  { fill: #E1F5EE; stroke: #0F6E56; }
      .collab-box { fill: #EEEDFE; stroke: #534AB7; }
      .remote-box { fill: #FAEEDA; stroke: #854F0B; }
      .owner-th   { fill: #085041; }
      .owner-ts   { fill: #0F6E56; }
      .collab-th  { fill: #3C3489; }
      .collab-ts  { fill: #534AB7; }
      .remote-th  { fill: #633806; }
      .remote-ts  { fill: #854F0B; }
      .push-owner  { stroke: #1D9E75; }
      .push-collab { stroke: #7F77DD; }
      .muted { stroke: #888780; fill: none; opacity: 0.4; }
      .label { fill: #5F5E5A; }
      .invite { stroke: #888780; fill: none; opacity: 0.5; }
    </style>
  </defs>

  <!-- Owner local repo — left -->
  <rect x="40" y="110" width="160" height="56" rx="8" stroke-width="0.5" class="owner-box"/>
  <text class="th owner-th" x="120" y="134" text-anchor="middle" dominant-baseline="central">Owner</text>
  <text class="ts owner-ts" x="120" y="152" text-anchor="middle" dominant-baseline="central">local repo</text>

  <!-- Collaborator local repo — right -->
  <rect x="480" y="110" width="160" height="56" rx="8" stroke-width="0.5" class="collab-box"/>
  <text class="th collab-th" x="560" y="134" text-anchor="middle" dominant-baseline="central">Collaborator</text>
  <text class="ts collab-ts" x="560" y="152" text-anchor="middle" dominant-baseline="central">local repo</text>

  <!-- Remote repo — center -->
  <rect x="250" y="100" width="180" height="76" rx="8" stroke-width="0.5" class="remote-box"/>
  <text class="th remote-th" x="340" y="122" text-anchor="middle" dominant-baseline="central">Remote repo</text>
  <text class="ts remote-ts" x="340" y="142" text-anchor="middle" dominant-baseline="central">GitHub</text>
  <text class="ts remote-ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">(shared, authoritative)</text>

  <!-- Owner push arrow -->
  <line x1="200" y1="128" x2="248" y2="128" class="push-owner" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts label" x="224" y="120" text-anchor="middle" dominant-baseline="central">push</text>

  <!-- Owner pull arrow -->
  <line x1="250" y1="148" x2="202" y2="148" class="push-owner" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts label" x="226" y="163" text-anchor="middle" dominant-baseline="central">pull</text>

  <!-- Collaborator push arrow -->
  <line x1="480" y1="128" x2="432" y2="128" class="push-collab" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts label" x="456" y="120" text-anchor="middle" dominant-baseline="central">push</text>

  <!-- Collaborator pull arrow -->
  <line x1="430" y1="148" x2="478" y2="148" class="push-collab" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts label" x="454" y="163" text-anchor="middle" dominant-baseline="central">pull</text>

  <!-- Laptop outlines -->
  <rect x="72" y="196" width="96" height="60" rx="4" class="muted" stroke-width="0.5"/>
  <rect x="64" y="256" width="112" height="6" rx="3" class="muted" stroke-width="0.5"/>
  <rect x="512" y="196" width="96" height="60" rx="4" class="muted" stroke-width="0.5"/>
  <rect x="504" y="256" width="112" height="6" rx="3" class="muted" stroke-width="0.5"/>

  <!-- Sync label -->
  <text class="ts label" x="340" y="300" text-anchor="middle">All three copies stay in sync</text>
  <line x1="160" y1="280" x2="265" y2="294" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
  <line x1="520" y1="280" x2="415" y2="294" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>

  <!-- Invite arc: Owner → Collaborator -->
  <path d="M200 96 Q340 36 480 96" class="invite" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts label" x="340" y="52" text-anchor="middle">invite as collaborator</text>
</svg>
